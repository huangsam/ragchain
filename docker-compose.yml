services:
  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_demo_data:/data
    profiles: ["test", "demo", "prod"]
    healthcheck:
      # https://cookbook.chromadb.dev/running/health-checks/#docker-compose
      test: [ "CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000" ]
      interval: 5s
      timeout: 5s
      retries: 5

  ragchain:
    build:
      context: .
      dockerfile: Dockerfile.demo
    depends_on:
      - chroma
    profiles: ["demo", "prod"]
    environment:
      - CHROMA_SERVER_URL=http://chroma:8000
      # Point to host's Ollama instance
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Embedding model (bge-m3 with 8k context for semantic search)
      - OLLAMA_EMBED_MODEL=bge-m3
      # Default model to use for generation (ensure you have pulled it: `ollama pull deepseek-r1`)
      - OLLAMA_MODEL=deepseek-r1
      # Performance optimization flags
      - ENABLE_GRADING=true
      - ENABLE_INTENT_ROUTING=true
    # Map to a different host port to avoid conflicts with local dev servers
    ports:
      - "8003:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  demo-runner:
    build:
      context: .
      dockerfile: Dockerfile.demo
    depends_on:
      ragchain:
        condition: service_healthy
      chroma:
        condition: service_healthy
    profiles: ["demo"]
    environment:
      - RAGCHAIN_API_URL=http://ragchain:8000
      - CHROMA_SERVER_URL=http://chroma:8000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    entrypoint: ["ragchain", "ingest", "--n", "50"]

volumes:
  chroma_demo_data:
